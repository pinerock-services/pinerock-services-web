<!DOCTYPE html>

<head>

<title>Página no encontrada — PineRock Services LLC</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--blue:#013F80;--green:#31920B;--ink:#10202E;--ink-soft:#42596C;--mist:#EDF2F7;--line:#C9D7E4;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,var(--mist),#fff 70%);color:var(--ink);
  font:400 17px/1.65 "Source Sans 3",-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  display:grid;place-items:center;text-align:center;padding:32px 20px}
img{width:120px;height:auto;margin:0 auto 24px;display:block}
h1{font-family:Archivo,sans-serif;font-weight:800;font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.1;margin:0 0 12px;letter-spacing:-.015em}
p{color:var(--ink-soft);max-width:52ch;margin:0 auto 26px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
a.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 22px;border-radius:10px;
  font-family:Archivo,sans-serif;font-weight:700;text-decoration:none;border:2px solid transparent}
.b1{background:var(--green);color:#fff}
.b1:hover{background:#256F08}
.b2{border-color:var(--line);color:var(--blue);background:#fff}
.b2:hover{border-color:var(--blue);background:var(--mist)}
:focus-visible{outline:3px solid var(--green);outline-offset:3px}
@media (max-width:520px){a.btn{width:100%}}
</style>
</head>
<body>
<main>
  <img src="/assets/icon-192.png" alt="PineRock Services LLC">

  <p>El enlace que has seguido no lleva a ninguna parte. Vuelve al inicio o escríbenos y te ayudamos con tu proyecto.</p>
  <div class="row">
    <a class="btn b1" href="/">Ir al inicio</a>
    <a class="btn b2" href="https://wa.me/14076331053" target="_blank" rel="noopener">Escribir por WhatsApp</a>
  </div>
</main>
</body>
</html>
